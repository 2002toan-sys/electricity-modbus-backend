services:
  modbus-backend:
    # Image name on Docker Hub
    image: nguyenvietanh10326/hotel-modbus-backend:v11.6

    # Allows local building using the Dockerfile in this directory
    build:
      context: .
      dockerfile: Dockerfile

    container_name: modbus_backend_app

    # Restart policy for production
    restart: unless-stopped

    ports:
      # Host port : Container port
      - "3000:3000"

    # Persist SQLite data and optional file logs outside the container.
    volumes:
      - "${BACKEND_DATA_DIR}:/app/data"
      - "${BACKEND_LOGS_DIR}:/app/logs"

    env_file:
      - .env

    networks:
      - my_global_network

networks:
  my_global_network:
    external: true
