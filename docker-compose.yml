services:
  modbus-backend:
    # Image name on Docker Hub
    image: nguyenvietanh10326/hotel-modbus-backend:latest

    # Allows local building using the Dockerfile in this directory
    build:
      context: .
      dockerfile: Dockerfile

    container_name: modbus_backend_app

    # Restart policy for production
    restart: unless-stopped

    ports:
      # Host port : Container port
      - "3000:3000"

    # Bind mounts: map host directories directly into container
    volumes:
      - /home/hotel-modbus-backend-v2/data:/app/data
      - /home/hotel-modbus-backend-v2/logs:/app/logs
      - /home/hotel-modbus-backend-v2/config:/app/src/config

    # Load environment variables from .env file
    env_file:
      - .env

    # Environment variable overrides
    environment:
      - NODE_ENV=production

    networks:
      - my_global_network

networks:
  my_global_network:
    external: true
